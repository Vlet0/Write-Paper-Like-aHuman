    <text x="303.0" y="203" text-anchor="middle" fill="#2dd4bf" font-size="12" font-weight="700">Bước 5b/c: Method &amp; Hình</text>
    <text x="303.0" y="224" text-anchor="middle" fill="#94a3b8" font-size="10.5">Need-Mech-Prop / TikZ</text>
