<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 270" width="100%" height="100%" style="background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-turn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Row 1 Header -->
  <text x="26" y="32" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">GIAI ĐOẠN 1: ĐỊNH VỊ KHOA HỌC &amp; KIẾN TRÚC TỰ SỰ</text>
  <rect x="26" y="37" width="928" height="1" fill="#1e293b" />

