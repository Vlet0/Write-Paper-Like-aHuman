    <text x="107.0" y="97" text-anchor="middle" fill="#94a3b8" font-size="10.5">Form JSON / Tách nháp</text>
  </g>
  <line x1="192" y1="82.0" x2="218" y2="82.0" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <g filter="url(#glow)">
    <rect x="222" y="48" width="162" height="68" rx="8" fill="#1e293b" stroke="#4f46e5" stroke-width="1.5" />
    <text x="303.0" y="76" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="700">Bước 1: Định vị</text>
    <text x="303.0" y="97" text-anchor="middle" fill="#94a3b8" font-size="10.5">Claim, Tension, Insight</text>
  </g>
  <line x1="388" y1="82.0" x2="414" y2="82.0" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
