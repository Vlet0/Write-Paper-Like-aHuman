    <text x="499.0" y="76" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">Bước 2: Phân luồng</text>
    <text x="499.0" y="97" text-anchor="middle" fill="#94a3b8" font-size="10.5">8 Dạng bài L1–L8</text>
  </g>
  <line x1="584" y1="82.0" x2="610" y2="82.0" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <g filter="url(#glow)">
    <rect x="614" y="48" width="162" height="68" rx="8" fill="#1e293b" stroke="#9333ea" stroke-width="1.5" />
    <text x="695.0" y="76" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">Bước 3: Hiệu chuẩn</text>
    <text x="695.0" y="97" text-anchor="middle" fill="#94a3b8" font-size="10.5">Ánh xạ bằng chứng</text>
  </g>
  <line x1="780" y1="82.0" x2="806" y2="82.0" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <g filter="url(#glow)">
    <rect x="810" y="48" width="162" height="68" rx="8" fill="#1e293b" stroke="#c026d3" stroke-width="1.5" />
    <text x="891.0" y="76" text-anchor="middle" fill="#e879f9" font-size="12" font-weight="700">Bước 4: Dàn ý</text>
    <text x="891.0" y="97" text-anchor="middle" fill="#94a3b8" font-size="10.5">5 Đoạn văn &amp; Pivots</text>
  </g>

  <!-- Connector from Step 4 down and back to Step 5 -->
  <path d="M 972 82.0 C 965 82.0, 965 155, 418 155 L 55 155 C 20 155, 20 209.0, 23 209.0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-turn)" />

  <!-- Row 2 Header -->
  <text x="26" y="157" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">GIAI ĐOẠN 2: SOẠN THẢO, KHỬ DẤU VẾT AI &amp; KIỂM ĐỊNH</text>
  <rect x="26" y="164" width="928" height="1" fill="#1e293b" />

