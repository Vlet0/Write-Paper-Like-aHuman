  <line x1="584" y1="209.0" x2="610" y2="209.0" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <g filter="url(#glow)">
    <rect x="614" y="175" width="162" height="68" rx="8" fill="#1e293b" stroke="#ea580c" stroke-width="1.5" />
    <text x="695.0" y="203" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="700">Bước 7: Kiểm định</text>
    <text x="695.0" y="224" text-anchor="middle" fill="#94a3b8" font-size="10.5">check_draft.py tự động</text>
  </g>
  <line x1="780" y1="209.0" x2="806" y2="209.0" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <g filter="url(#glow)">
    <rect x="810" y="175" width="162" height="68" rx="8" fill="#1e293b" stroke="#e11d48" stroke-width="1.5" />
    <text x="891.0" y="203" text-anchor="middle" fill="#fb7185" font-size="12" font-weight="700">Bước 8: Bàn giao</text>
    <text x="891.0" y="224" text-anchor="middle" fill="#94a3b8" font-size="10.5">LaTeX CVPR + report</text>
