    <text x="107.0" y="203" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">Bước 5: Kho mẫu</text>
    <text x="107.0" y="224" text-anchor="middle" fill="#94a3b8" font-size="10.5">60 Bài báo Best Paper</text>
  </g>
  <line x1="192" y1="209.0" x2="218" y2="209.0" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <g filter="url(#glow)">
