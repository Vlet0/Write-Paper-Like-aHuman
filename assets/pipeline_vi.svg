  <line x1="388" y1="209.0" x2="414" y2="209.0" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <g filter="url(#glow)">
    <rect x="418" y="175" width="162" height="68" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="1.5" />
    <text x="499.0" y="203" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">Bước 6: Khử AI</text>
    <text x="499.0" y="224" text-anchor="middle" fill="#94a3b8" font-size="10.5">26 Tells &amp; StoryScope</text>
